name: Publish to WordPress SVN

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Final release version for SVN tag, for example 1.0.4"
        required: true
      dry_run:
        description: "Run in dry-run mode"
        required: true
        default: "true"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  svn-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Publish to SVN from master
        uses: ./.github/actions/deploy-wordpress-svn
        with:
          version: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
          dry_run: ${{ github.event_name == 'release' && 'false' || inputs.dry_run }}
          svn_username: ${{ secrets.SVN_USERNAME }}
          svn_password: ${{ secrets.SVN_PASSWORD }}
          svn_url: ${{ secrets.SVN_URL }}
          matrix_server: ${{ secrets.MATRIX_SERVER }}
          matrix_room: ${{ secrets.MATRIX_GITHUB_WORKFLOW_FEED }}
          matrix_token: ${{ secrets.MATRIX_USER_TOKEN }}
