name: Deploy WordPress SVN
description: Publish WordPress plugin to SVN from prepared beta release asset
inputs:
  version:
    required: true
  beta_tag:
    required: true
  asset_name:
    required: true
  dry_run:
    required: true
  svn_username:
    required: true
  svn_password:
    required: true
  svn_url:
    required: true
  github_token:
    required: true
  matrix_server:
    required: false
  matrix_room:
    required: false
  matrix_token:
    required: false
runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y subversion unzip rsync python3 curl

    - name: Run deploy script
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_BETA_TAG: ${{ inputs.beta_tag }}
        INPUT_ASSET_NAME: ${{ inputs.asset_name }}
        INPUT_DRY_RUN: ${{ inputs.dry_run }}
        INPUT_SVN_USERNAME: ${{ inputs.svn_username }}
        INPUT_SVN_PASSWORD: ${{ inputs.svn_password }}
        INPUT_SVN_URL: ${{ inputs.svn_url }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
        INPUT_MATRIX_SERVER: ${{ inputs.matrix_server }}
        INPUT_MATRIX_ROOM: ${{ inputs.matrix_room }}
        INPUT_MATRIX_TOKEN: ${{ inputs.matrix_token }}
      run: bash ${{ github.action_path }}/entrypoint.sh
